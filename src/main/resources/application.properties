# ===== SERVIDOR =====
server.port=8080

# ===== BANCO DE DADOS (com PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/api-help360
spring.datasource.username=postgres
spring.datasource.password=gust@v09
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# Chave secreta usada pelo TokenService (Coloque algo longo e seguro em produção)
api.security.token.secret=chave-api

# ===== SWAGGER =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===== UPLOAD DE ARQUIVOS =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/